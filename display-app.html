<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>International Smart Display</title>

<!-- PWA settings -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#141210">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Smart Display">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root{
    --bg:#ffffff;
    --ink:#221f1b;
    --muted:#8a8177;
    --accent:#b5762f;
    --accent-strong:#2f5d50;
    --wa-green:#25D366;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ height:100%; overflow:hidden; background:var(--bg); }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
    width:100vw; height:100vh;
    position:relative;
  }

  /* Main Stage for Slides */
  #stage{ position:relative; width:100%; height:100%; touch-action:none; }
  .slide{ position:absolute; inset:0; opacity:0; transition:opacity 900ms ease; display:flex; flex-direction:column; background:var(--bg); }
  .slide.active{ opacity:1; z-index:1; }
  .img-wrap{ flex:1; position:relative; overflow:hidden; background:#111; display:flex; align-items:center; justify-content:center; }
  .img-wrap img, .img-wrap video{ width:100%; height:100%; object-fit:cover; }

  /* Start Overlay - Centered Content */
  .start-overlay{
    position:fixed; inset:0; z-index:50; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  .start-overlay .icon{
    width:70px; height:70px; border-radius:20px; background:var(--accent-strong);
    display:flex; align-items:center; justify-content:center; font-size:32px; color:#fff;
    margin-bottom: 20px;
  }
  .start-overlay h2{ font-size:24px; font-weight:800; margin-bottom: 10px; }
  .start-overlay p{ color:var(--muted); font-size:14px; max-width:300px; margin-bottom: 20px; }

  /* Branch Dropdown */
  #branchInput {
    width:100%; max-width:280px; padding:14px; border-radius:12px; border:1px solid #ddd; 
    font-size:15px; text-align:center; background:#fff; margin-bottom:25px;
  }

  /* Emergency/Prominent Start Button */
  .start-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 16px;
    padding: 22px 60px; /* আরও বড় করা হয়েছে */
    font-size: 20px;    /* বড় ফন্ট */
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 12px 24px rgba(181, 118, 47, 0.4);
    transition: all 0.2s ease;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    display: block;
    margin: 0 auto;
  }
  .start-btn:active { transform: scale(0.95); box-shadow: 0 5px 10px rgba(181, 118, 47, 0.2); }

  /* Professional Developer Credit at the very bottom */
  .dev-footer {
    position: absolute;
    bottom: 25px; /* স্ক্রিনের একদম নিচে থাকবে */
    left: 0;
    right: 0;
    text-align: center;
  }
  .dev-footer .dev-tag {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 5px;
    display: block;
  }
  .dev-footer .dev-name {
    font-size: 14px;
    font-weight: 800;
    color: var(--ink);
    font-family: 'Poppins', sans-serif;
    margin-bottom: 8px;
  }
  .dev-footer .wa-link {
    display: inline-block;
    color: var(--wa-green);
    text-decoration: none;
    font-weight: 700;
    font-size: 13px;
    border: 1px solid rgba(37, 211, 102, 0.3);
    padding: 5px 15px;
    border-radius: 20px;
    transition: background 0.3s;
  }
  .dev-footer .wa-link:hover { background: rgba(37, 211, 102, 0.1); }

  /* Status and Navigation UI */
  .conn-dot{ position:fixed; bottom:15px; right:12px; width:8px; height:8px; border-radius:50%; background:#4caf7d; z-index:10; }
  .back-btn{ position:fixed; top:15px; right:12px; padding:8px 15px; border-radius:20px; background:rgba(0,0,0,0.05); color:var(--muted); font-size:12px; font-weight:600; z-index:10; cursor:pointer; }
  .tap-zone{ position:fixed; top:0; bottom:0; width:30%; z-index:7; }
  .tap-zone-left{ left:0; } .tap-zone-right{ right:0; }
</style>
</head>
<body>

<!-- Initial Start Overlay -->
<div class="start-overlay" id="startOverlay">
  <div class="icon">▶</div>
  <h2>International Smart Display</h2>
  <p>Select your branch below to begin the display.</p>
  
  <select id="branchInput">
    <option value="">All Branches</option>
  </select>

  <!-- Centered Emergency Button -->
  <button class="start-btn" onclick="launchFullscreen()">Start Display</button>

  <!-- Hidden/Subtle Credit at Footer -->
  <div class="dev-footer">
    <span class="dev-tag">Developer</span>
    <div class="dev-name">MD RAJIB AL ADNAN</div>
    <a href="https://wa.me/966501713483" target="_blank" class="wa-link">
      WhatsApp
    </a>
  </div>
</div>

<div id="stage"></div>
<div class="conn-dot" id="connDot"></div>
<div class="back-btn" id="backBtn" onclick="exitToStart()">← Branch</div>
<div class="tap-zone tap-zone-left" onclick="manualNav(-1)"></div>
<div class="tap-zone tap-zone-right" onclick="manualNav(1)"></div>

<script>
// Supabase Configuration (অপরিবর্তিত)
const SUPABASE_URL = "https://zlknqthxjimngofrlxvd.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpsa25xdGh4amltbmdvZnJseHZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2NjUyODgsImV4cCI6MjEwMDI0MTI4OH0.t1TdTcH7xYlcYMufKHwfIKoLe0BBsfRDuIWk5Z7MRJ8";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let products = [];
let currentIndex = 0;
let slideTimer = null;
let BRANCH_FILTER = localStorage.getItem('display_branch') || '';

async function fetchProducts(){
  let query = BRANCH_FILTER 
    ? sb.from('products').select('*').eq('branch', BRANCH_FILTER).order('id', {ascending:false})
    : sb.from('products').select('*').order('id', {ascending:false});
  const { data } = await query;
  products = data || [];
  renderStage();
  restartCycle();
}

function renderStage(){
  const stage = document.getElementById('stage');
  if(products.length === 0){
    stage.innerHTML = '<div style="display:flex; height:100%; align-items:center; justify-content:center; color:#888;">No Products Found</div>';
    return;
  }
  stage.innerHTML = products.map((p, i) => `
    <div class="slide ${i === currentIndex ? 'active' : ''}" data-i="${i}">
      <div class="img-wrap">
        ${p.video_url ? `<video src="${p.video_url}" loop muted playsinline autoplay></video>` : `<img src="${p.image_url}">`}
      </div>
    </div>
  `).join('');
}

function goToSlide(i){
  const slides = document.querySelectorAll('.slide');
  slides.forEach(s => s.classList.toggle('active', Number(s.dataset.i) === i));
}

function restartCycle(){
  if(slideTimer) clearTimeout(slideTimer);
  if(products.length === 0) return;
  goToSlide(currentIndex);
  slideTimer = setTimeout(() => {
    currentIndex = (currentIndex + 1) % products.length;
    restartCycle();
  }, 5000);
}

function manualNav(dir){
  currentIndex = (currentIndex + dir + products.length) % products.length;
  restartCycle();
}

function launchFullscreen(){
  BRANCH_FILTER = document.getElementById('branchInput').value;
  localStorage.setItem('display_branch', BRANCH_FILTER);
  fetchProducts();
  document.documentElement.requestFullscreen?.().catch(()=>{});
  document.getElementById('startOverlay').style.display = 'none';
}

function exitToStart(){
  if(slideTimer) clearTimeout(slideTimer);
  document.exitFullscreen?.().catch(()=>{});
  document.getElementById('startOverlay').style.display = 'flex';
}

async function loadBranches(){
  const { data } = await sb.from('branches').select('name');
  const select = document.getElementById('branchInput');
  data?.forEach(b => {
    const opt = document.createElement('option');
    opt.value = b.name; opt.textContent = b.name;
    select.appendChild(opt);
  });
  if(BRANCH_FILTER) select.value = BRANCH_FILTER;
}

loadBranches();
fetchProducts();
</script>
</body>
</html>
