<style>
  :root{
    --bg:#ffffff;
    --ink:#221f1b;
    --muted:#8a8177;
    --accent:#b5762f;
    --accent-strong:#2f5d50;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ height:100%; overflow:hidden; background:var(--bg); }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
    width:100vw; height:100vh; height:100dvh;
    position:relative;
  }

  #stage{ position:relative; width:100%; height:100%; touch-action:none; will-change:transform; }

  .slide{
    position:absolute; inset:0;
    opacity:0; transition:opacity 900ms ease;
    display:flex; flex-direction:column;
    background:var(--bg);
  }
  .slide.active{ opacity:1; z-index:1; }

  .img-wrap{
    flex:1; position:relative; overflow:hidden; background:#111;
    display:flex; align-items:center; justify-content:center;
  }
  .img-wrap img, .img-wrap video{
    width:100%; height:100%;
    object-fit:cover;
    filter:saturate(1.02);
  }
  .img-wrap.no-image{ display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:15px;}

  .info{
    position:absolute; left:0; right:0; bottom:0;
    padding:16px 24px calc(20px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, rgba(0,0,0,.62), rgba(0,0,0,0) 100%);
    text-align:center;
  }
  .info h1{ color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.4); }
  .info p.desc{ color:rgba(255,255,255,.85); }
  .bottom-spacer{ flex:0.1; background:var(--bg); }
  .info .eyebrow{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent);
    font-weight:700; margin-bottom:2px;
  }
  .info h1{
    font-size:clamp(20px, 5vw, 34px); font-weight:800; line-height:1.1; margin-bottom:2px; color:var(--ink);
  }
  .info p.desc{
    font-size:clamp(13px, 2.6vw, 15px); color:var(--muted); max-width:640px; line-height:1.3; margin-bottom:4px;
    margin-left:auto; margin-right:auto;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .price-row{ display:flex; align-items:baseline; gap:10px; justify-content:center; }
  .price-now{ font-size:clamp(22px, 5vw, 32px); font-weight:800; color:var(--accent); direction:ltr; unicode-bidi:isolate; }
  .price-old{ font-size:clamp(14px, 3vw, 18px); color:var(--muted); text-decoration:line-through; direction:ltr; unicode-bidi:isolate; }

  .progress-track{
    display:none;
  }
  .progress-seg{
    flex:1; height:3px; background:rgba(0,0,0,.1); border-radius:3px; overflow:hidden;
  }
  .progress-seg .fill{
    height:100%; width:0%; background:var(--accent); border-radius:3px;
  }
  .progress-seg.done .fill{ width:100%; transition:none; }
  .progress-seg.current .fill{ width:0%; transition:width linear; }

  .empty-state{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:30px; color:var(--muted); gap:8px;
  }
  .empty-state .glyph{ font-size:44px; }
  .empty-state h2{ color:var(--ink); font-size:20px; }

  .conn-dot{
    position:fixed; bottom:calc(10px + env(safe-area-inset-bottom)); right:12px;
    width:8px; height:8px; border-radius:50%; background:#4caf7d; opacity:.6; z-index:10;
  }
  .conn-dot.off{ background:#c0453a; }

  .back-btn{
    position:fixed; top:calc(10px + env(safe-area-inset-top)); right:12px;
    padding:6px 12px; border-radius:16px;
    background:transparent; color:rgba(34,31,27,.12);
    font-size:12px; font-weight:600; z-index:10; cursor:pointer;
    -webkit-tap-highlight-color:transparent; user-select:none;
  }
  .back-btn:active{ color:rgba(34,31,27,.45); }

  .pause-btn{
    position:fixed; bottom:calc(10px + env(safe-area-inset-bottom)); left:44px;
    width:26px; height:26px; border-radius:50%;
    background:transparent; color:rgba(34,31,27,.15);
    display:flex; align-items:center; justify-content:center;
    font-size:11px; z-index:10; cursor:pointer;
    -webkit-tap-highlight-color:transparent; user-select:none;
  }
  .pause-btn.active{ color:var(--accent); background:rgba(0,0,0,.06); }

  .tap-zone{
    position:fixed; top:0; bottom:0; width:38%; z-index:7;
    display:flex; align-items:center; cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  .tap-zone-left{ left:0; justify-content:flex-start; padding-left:14px; }
  .tap-zone-right{ right:0; justify-content:flex-end; padding-right:14px; }
  .tap-zone .arrow-hint{
    color:rgba(34,31,27,.10); font-size:15px;
  }
  .tap-zone:active .arrow-hint{ color:rgba(34,31,27,.35); }

  /* নতুন প্রফেশনাল ওভারলে স্টাইল */
  .start-overlay{
    position:fixed; inset:0; z-index:50; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  .start-overlay .icon{
    width:64px; height:64px; border-radius:16px; background:var(--accent-strong);
    display:flex; align-items:center; justify-content:center; font-size:30px; margin-bottom: 10px;
  }
  .start-overlay h2{ font-size:22px; margin-bottom: 5px; }
  .start-overlay p{ color:var(--muted); font-size:13px; max-width:280px; margin-bottom: 15px; }

  /* ইমার্জেন্সি বড় বাটন - মাঝ বরাবর */
  .start-overlay button{
    margin-top:10px; background:var(--accent); color:#fff; border:none; border-radius:14px;
    padding:20px 70px !important; font-size:19px !important; font-weight:800; cursor:pointer;
    box-shadow: 0 8px 25px rgba(181, 118, 47, 0.4);
    text-transform: uppercase; letter-spacing: 1px;
  }

  /* প্রফেশনাল ফুটার ক্রেডিট */
  .dev-footer {
    position: absolute;
    bottom: 30px;
    width: 100%;
    text-align: center;
  }
  .dev-footer .label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    display: block;
    margin-bottom: 4px;
  }
  .dev-footer .name {
    font-size: 16px;
    font-weight: 800;
    color: var(--ink);

  .dev-footer a {

    font-weight: 700;
    font-size: 14px;
    border: 1.5px solid rgba(37, 211, 102, 0.4);
    padding: 6px 20px;
    border-radius: 25px;
  }

const SUPABASE_URL = "https://zlknqthxjimngofrlxvd.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpsa25xdGh4amltbmdvZnJseHZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2NjUyODgsImV4cCI6MjEwMDI0MTI4OH0.t1TdTcH7xYlcYMufKHwfIKoLe0BBsfRDuIWk5Z7MRJ8";
const SLIDE_SECONDS = 5;

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const FONT_MAP = {
  default: { css:'-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif', style:'normal' },
  poppins: { css:'"Poppins",sans-serif', style:'normal' },
  playfair: { css:'"Playfair Display",serif', style:'normal' },
  playfair_italic: { css:'"Playfair Display",serif', style:'italic' },
  bebas: { css:'"Bebas Neue",sans-serif', style:'normal' },
  oswald: { css:'"Oswald",sans-serif', style:'normal' },
  pacifico: { css:'"Pacifico",cursive', style:'normal' },
  dancing: { css:'"Dancing Script",cursive', style:'normal' },
  great_vibes: { css:'"Great Vibes",cursive', style:'normal' },
  caveat: { css:'"Caveat",cursive', style:'normal' },
  sacramento: { css:'"Sacramento",cursive', style:'normal' },
  alex_brush: { css:'"Alex Brush",cursive', style:'normal' },
  allura: { css:'"Allura",cursive', style:'normal' },
  kaushan: { css:'"Kaushan Script",cursive', style:'normal' },
  yellowtail: { css:'"Yellowtail",cursive', style:'normal' },
  satisfy: { css:'"Satisfy",cursive', style:'normal' },
  cookie: { css:'"Cookie",cursive', style:'normal' },
  marck: { css:'"Marck Script",cursive', style:'normal' },
  parisienne: { css:'"Parisienne",cursive', style:'normal' },
  tangerine: { css:'"Tangerine",cursive', style:'normal' }
};
function fontCss(key){ return (FONT_MAP[key] || FONT_MAP.default).css; }
function fontStyle(key){ return (FONT_MAP[key] || FONT_MAP.default).style; }

const symbols = { BDT:'৳', USD:'$', EUR:'€', BRL:'R$', GBP:'£', INR:'₹', SAR:'﷼', AED:'د.إ' };
const sym = c => c === '' ? '' : (symbols[c] || (c ? c + ' ' : '৳'));

let products = [];
let currentIndex = 0;
let slideTimer = null;
let progressStart = null;
let soundEnabled = false;

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

let BRANCH_FILTER = new URLSearchParams(location.search).get('branch') || localStorage.getItem('display_branch') || '';

async function fetchProducts(){
  let query = BRANCH_FILTER
    ? sb.from('products').select('*').eq('branch', BRANCH_FILTER).or('show_on_display.is.null,show_on_display.eq.true').order('sort_order', {ascending:true, nullsFirst:false}).order('id', {ascending:false})
    : sb.from('products').select('*').or('show_on_display.is.null,show_on_display.eq.true').order('id', {ascending:false});
  const { data, error } = await query;
  if(error){ console.error(error); return; }
  products = data || [];
  await preloadImages(products);
  renderStage();
  restartCycle();
}

function preloadImages(list){
  const urls = list.map(p => p.image_url).filter(Boolean);
  if(urls.length === 0) return Promise.resolve();
  const loaders = urls.map(url => new Promise(resolve => {
    const img = new Image();
    img.onload = resolve;
    img.onerror = resolve;
    img.src = url;
  }));
  const timeout = new Promise(resolve => setTimeout(resolve, 6000));
  return Promise.race([Promise.all(loaders), timeout]);
}

function renderStage(){
  const stage = document.getElementById('stage');
  const track = document.getElementById('progressTrack');

  if(products.length === 0){
    stage.innerHTML = `
      <div class="empty-state">
        <div class="glyph">🗂️</div>
        <h2>No products yet</h2>
        <p>Add products from the Admin Panel and they'll appear here automatically.</p>
      </div>`;
    track.innerHTML = '';
    return;
  }

  if(currentIndex >= products.length) currentIndex = 0;

  const mediaHtml = p => {
    if(p.video_url){
      return `<video src="${p.video_url}" loop muted playsinline></video>`;
    }
    if(p.image_url){
      return `<img src="${p.image_url}">`;
    }
    return 'No image';
  };

  stage.innerHTML = products.map((p, i) => {
    const hasElements = p.layout && Array.isArray(p.layout.elements);
    const hasMedia = !!(p.video_url || p.image_url);

    if(hasElements){
      const elementsHtml = p.layout.elements.map(el => {
        if(el.type === 'image'){
          return `<img src="${el.src}" style="position:absolute; left:${el.x}%; top:${el.y}%; transform:translate(-50%,-50%); width:${(el.width||70)*2.4}px; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,.2);">`;
        }
        const lines = (el.text || '').split('\n').map(l => escapeHtml(l)).join('<br>');
        return `<div class="stage-text" data-font="${el.font || 'default'}" style="position:absolute; left:${el.x}%; top:${el.y}%; transform:translate(-50%,-50%); text-align:center; padding:4px 10px; max-width:82%; font-family:${fontCss(el.font)}; font-style:${fontStyle(el.font)}; font-weight:${el.bold?800:500}; font-size:${(el.size||16)*1.4}px; color:${el.color||'#1c1a17'}; white-space:pre-line; line-height:1.3; direction:ltr; unicode-bidi:isolate; text-shadow:0 1px 3px rgba(0,0,0,.25);">${lines}</div>`;
      }).join('');
      return `
    <div class="slide ${i === currentIndex ? 'active' : ''}" data-i="${i}">
      <div class="img-wrap ${hasMedia ? '' : 'no-image'}" style="flex:1;">
        ${mediaHtml(p)}
        ${elementsHtml}
      </div>
    </div>
  `;
    }

    return `
    <div class="slide ${i === currentIndex ? 'active' : ''}" data-i="${i}">
      <div class="img-wrap ${hasMedia ? '' : 'no-image'}">
        ${mediaHtml(p)}
      </div>
    </div>
  `;
  }).join('');

  track.innerHTML = products.map((p, i) => `
    <div class="progress-seg ${i < currentIndex ? 'done' : ''} ${i === currentIndex ? 'current' : ''}" data-i="${i}">
      <div class="fill"></div>
    </div>
  `).join('');

  if(window.reapplyAllZoom) window.reapplyAllZoom();
  forceFontRepaint(stage);
  
  if(soundEnabled) enableVideoSound();
}

function forceFontRepaint(container){
  if(!(document.fonts && document.fonts.load)) return;
  container.querySelectorAll('.stage-text').forEach(node => {
    const key = node.dataset.font || 'default';
    const primaryFamily = fontCss(key).split(',')[0].trim();
    document.fonts.load(`16px ${primaryFamily}`).then(() => {
      node.style.fontFamily = 'inherit';
      requestAnimationFrame(() => { node.style.fontFamily = fontCss(key); });
    }).catch(()=>{});
  });
}

function slideSeconds(i){
  const p = products[i];
  const n = p && p.display_seconds;
  return (n && n > 0) ? n : SLIDE_SECONDS;
}

function goToSlide(i){
  const slides = document.querySelectorAll('.slide');
  slides.forEach(s => {
    const isActive = (Number(s.dataset.i) === i);
    s.classList.toggle('active', isActive);

    const vid = s.querySelector('video');
    if(vid){
      if(isActive){
        vid.currentTime = 0; 
        vid.muted = !soundEnabled; 
        vid.play().catch(()=>{});
      } else {
        vid.pause(); 
        vid.muted = true; 
      }
    }
  });

  const segs = document.querySelectorAll('.progress-seg');
  segs.forEach(seg => {
    const si = Number(seg.dataset.i);
    seg.classList.remove('current');
    seg.classList.toggle('done', si < i);
    const fill = seg.querySelector('.fill');
    if(si < i){
      fill.style.transition = 'none';
      fill.style.width = '100%';
    } else if(si > i){
      fill.style.transition = 'none';
      fill.style.width = '0%';
    }
  });
  
  const currentSeg = document.querySelector(`.progress-seg[data-i="${i}"]`);
  if(currentSeg){
    currentSeg.classList.add('current');
    const fill = currentSeg.querySelector('.fill');
    fill.style.transition = 'none';
    fill.style.width = '0%';
    requestAnimationFrame(() => {
      fill.style.transition = `width ${slideSeconds(i)}s linear`;
      fill.style.width = '100%';
    });
  }
}

function restartCycle(){
  if(slideTimer) clearTimeout(slideTimer);
  if(products.length === 0) return;
  currentIndex = Math.min(currentIndex, products.length - 1);
  goToSlide(currentIndex);
  if(isPaused) return;
  slideTimer = setTimeout(() => {
    currentIndex = (currentIndex + 1) % products.length;
    goToSlide(currentIndex);
    scheduleNext();
  }, slideSeconds(currentIndex) * 1000);
}

function scheduleNext(){
  if(isPaused) return;
  slideTimer = setTimeout(() => {
    currentIndex = (currentIndex + 1) % products.length;
    goToSlide(currentIndex);
    scheduleNext();
  }, slideSeconds(currentIndex) * 1000);
}

function manualNav(direction){
  if(products.length === 0) return;
  currentIndex = (currentIndex + direction + products.length) % products.length;
  goToSlide(currentIndex);
  if(slideTimer) clearTimeout(slideTimer);
  scheduleNext();
}

let touchStartX = null;
document.getElementById('stage').addEventListener('touchstart', e => {
  touchStartX = e.touches.length === 1 ? e.touches[0].clientX : null;
}, { passive: true });
document.getElementById('stage').addEventListener('touchend', e => {
  if(touchStartX === null || e.changedTouches.length !== 1) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 50){
    manualNav(dx < 0 ? 1 : -1); 
  }
  touchStartX = null;
});

const channel = sb
  .channel('products-display-sync')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, () => {
    fetchProducts();
  })
  .subscribe(status => {
    const dot = document.getElementById('connDot');
    dot.classList.toggle('off', status !== 'SUBSCRIBED');
  });

setInterval(fetchProducts, 30000);

async function loadBranchOptions(){
  const select = document.getElementById('branchInput');
  try{
    const { data, error } = await sb.from('branches').select('*').order('name', { ascending: true });
    if(error || !data) return;
    data.forEach(b => {
      const opt = document.createElement('option');
      opt.value = b.name;
      opt.textContent = b.name;
      select.appendChild(opt);
    });
    if(BRANCH_FILTER){
      select.value = BRANCH_FILTER;
    }
  }catch(e){}
}

loadBranchOptions();
fetchProducts();

let wakeLockRef = null;

async function requestWakeLock(){
  if('wakeLock' in navigator){
    try{
      wakeLockRef = await navigator.wakeLock.request('screen');
    }catch(e){ }
  }
}

function startNoSleepFallback(){
  try{
    const video = document.getElementById('noSleepVideo');
    if(video){
      video.muted = true;
      video.play().catch(()=>{});
    }
  }catch(e){}
}

function showToast(message){
  const existing = document.getElementById('toastMsg');
  if(existing) existing.remove();
  const toast = document.createElement('div');
  toast.id = 'toastMsg';
  toast.textContent = message;
  toast.style.cssText = `
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(10px);
    background:#2f5d50; color:#fff;
    padding:12px 20px; border-radius:24px; font-size:13.5px; font-weight:600;
    box-shadow:0 8px 24px rgba(0,0,0,.2); z-index:999; opacity:0; transition:opacity .25s, transform .25s;
    max-width:88vw; text-align:center;
  `;
  document.body.appendChild(toast);
  requestAnimationFrame(() => {
    toast.style.opacity = '1';
    toast.style.transform = 'translateX(-50%) translateY(0)';
  });
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(-50%) translateY(10px)';
    setTimeout(() => toast.remove(), 300);
  }, 2000);
}

requestWakeLock();

function enableVideoSound(){
  const activeVideo = document.querySelector('.slide.active video');
  if(activeVideo){
    activeVideo.muted = false;
    activeVideo.play().catch(()=>{});
  }
}

function launchFullscreen(){
  const typedBranch = document.getElementById('branchInput').value;
  if(typedBranch){
    localStorage.setItem('display_branch', typedBranch);
    BRANCH_FILTER = typedBranch;
  } else {
    localStorage.removeItem('display_branch');
    BRANCH_FILTER = '';
  }
  fetchProducts();

  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
  if(req){ req.call(el).catch(()=>{}); }
  requestWakeLock();
  startNoSleepFallback();
  document.getElementById('startOverlay').style.display = 'none';

  soundEnabled = true;
  enableVideoSound();
}

function exitToStart(){
  if(slideTimer) clearTimeout(slideTimer);
  const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen;
  if(exit && document.fullscreenElement){ exit.call(document).catch(()=>{}); }
  document.getElementById('startOverlay').style.display = 'flex';
}

let isPaused = false;
function togglePause(){
  isPaused = !isPaused;
  const btn = document.getElementById('pauseBtn');
  if(isPaused){
    if(slideTimer) clearTimeout(slideTimer);
    btn.innerHTML = '&#9654;';
    btn.classList.add('active');
  } else {
    btn.innerHTML = '&#10073;&#10073;';
    btn.classList.remove('active');
    restartCycle();
  }
}

document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible'){
    requestWakeLock();
    startNoSleepFallback();
  }
});
setInterval(() => {
  if(document.visibilityState === 'visible'){
    requestWakeLock();
    startNoSleepFallback();
  }
}, 20000);
</script>
