<style>
  :root{
    --bg:#ffffff;
    --ink:#221f1b;
    --muted:#8a8177;
    --accent:#b5762f;
    --accent-strong:#2f5d50;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ height:100%; overflow:hidden; background:var(--bg); }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
    width:100vw; height:100vh; height:100dvh;
    position:relative;
  }

  #stage{ position:relative; width:100%; height:100%; touch-action:none; will-change:transform; }

  .slide{
    position:absolute; inset:0;
    opacity:0; transition:opacity 900ms ease;
    display:flex; flex-direction:column;
    background:var(--bg);
  }
  .slide.active{ opacity:1; z-index:1; }

  .img-wrap{
    flex:1; position:relative; overflow:hidden; background:#111;
    display:flex; align-items:center; justify-content:center;
  }
  .img-wrap img, .img-wrap video{
    width:100%; height:100%;
    object-fit:cover;
    filter:saturate(1.02);
  }
  .img-wrap.no-image{ display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:15px;}

  .progress-track{
    display:flex; position:fixed; top:0; left:0; right:0; height:3px; z-index:20; gap:4px; padding:0 10px;
  }
  .progress-seg{
    flex:1; height:3px; background:rgba(0,0,0,.1); border-radius:3px; overflow:hidden;
  }
  .progress-seg .fill{
    height:100%; width:0%; background:var(--accent); border-radius:3px;
  }
  .progress-seg.done .fill{ width:100%; transition:none; }
  .progress-seg.current .fill{ width:0%; transition:width linear; }

  .start-overlay{
    position:fixed; inset:0; z-index:50; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
    overflow-y: auto;
  }
  .start-overlay .icon{
    width:64px; height:64px; border-radius:16px; background:var(--accent-strong);
    display:flex; align-items:center; justify-content:center; font-size:30px; margin-bottom: 10px;
  }
  .start-overlay h2{ font-size:22px; margin-bottom: 5px; }
  .start-overlay button{
    margin-top:10px; background:var(--accent); color:#fff; border:none; border-radius:14px;
    padding:20px 70px !important; font-size:19px !important; font-weight:800; cursor:pointer;
    box-shadow: 0 8px 25px rgba(181, 118, 47, 0.4);
    text-transform: uppercase;
  }
  .dev-footer {
    position: absolute;
    bottom: 30px;
    width: 100%;
    text-align: center;
  }
  .dev-footer .name { font-weight: 800; font-family: 'Poppins', sans-serif; }

  .conn-dot{
    position:fixed; bottom:calc(10px + env(safe-area-inset-bottom)); right:12px;
    width:8px; height:8px; border-radius:50%; background:#4caf7d; opacity:.6; z-index:10;
  }
  .conn-dot.off{ background:#c0453a; }

  .back-btn{
    position:fixed; top:calc(10px + env(safe-area-inset-top)); right:12px;
    padding:6px 12px; border-radius:16px; font-size:12px; font-weight:600; z-index:10; cursor:pointer;
  }
</style>
</head>
<body>

<div class="start-overlay" id="startOverlay">
  <div class="icon" style="color:white">▶</div>
  <h2>International Smart Display</h2>
  <p>Which branch is this? Leave blank to show all branches.</p>
  <select id="branchInput" style="width:100%; max-width:280px; padding:12px 16px; border-radius:12px; border:1px solid #ddd6c9; margin-bottom:10px;">
    <option value="">All branches</option>
  </select>
  <button onclick="launchFullscreen()">Start Display</button>

  <div class="dev-footer">
    <span class="label">Developed By</span>
    <div class="name">MD RAJIB AL ADNAN</div>
  </div>
</div>

<div id="stage"></div>

<script>
// SW Registration
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js');
  });
}

const SUPABASE_URL = "https://zlknqthxjimngofrlxvd.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpsa25xdGh4amltbmdvZnJseHZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2NjUyODgsImV4cCI6MjEwMDI0MTI4OH0.t1TdTcH7xYlcYMufKHwfIKoLe0BBsfRDuIWk5Z7MRJ8";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let products = [];
let currentIndex = 0;
let slideTimer = null;

async function fetchProducts(){
  const { data } = await sb.from('products').select('*').order('id', {ascending:false});
  if(data) { products = data; renderStage(); restartCycle(); }
}

function renderStage(){
  const stage = document.getElementById('stage');
  stage.innerHTML = products.map((p, i) => `
    <div class="slide ${i === currentIndex ? 'active' : ''}" data-i="${i}">
      <div class="img-wrap"><img src="${p.image_url}"></div>
    </div>
  `).join('');
}

function restartCycle(){
  if(slideTimer) clearTimeout(slideTimer);
  if(products.length === 0) return;
  slideTimer = setTimeout(() => {
    currentIndex = (currentIndex + 1) % products.length;
    renderStage();
    restartCycle();
  }, 5000);
}

function launchFullscreen(){
  document.getElementById('startOverlay').style.display = 'none';
  if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  fetchProducts();
}

// আপনার লক্ষ্য করা সেই ২ লাইন কোড:
setInterval(fetchProducts, 30000); // ৩০ সেকেন্ডে আপডেট

setInterval(() => {
  if(document.visibilityState === 'visible'){
    // স্ক্রিন অন রাখার ফাংশন এখানে কল হবে
  }
}, 20000); // ২০ সেকেন্ডে স্ক্রিন চেক

</script>
